<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-Vindo!</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-image: url("https://i.gifer.com/J4o.gif");
            background-repeat: repeat; 
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; 
        }

        .boas-vindas {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }

        .boas-vindas h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .boas-vindas p {
            color: #666;
            margin-bottom: 30px;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-50px);
        }
    </style>
</head>
<body>

    <div class="boas-vindas">
        <h1>Bem-Vindo ao Nosso Site!</h1>
        <p>Aguarde um momento enquanto você é redirecionado...</p>
        </div>

    <script>
        setTimeout(function() {
            const boasVindasDiv = document.querySelector('.boas-vindas');
            boasVindasDiv.classList.add('fade-out');

            setTimeout(function() {
                window.location.href = 'index.html'; 
            }, 1000); 
        }, 5000); // 
    </script>

</body>
</html>
